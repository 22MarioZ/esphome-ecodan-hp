external_components:
  - source: github://22MarioZ/esphome-ecodan-hp@codex/single-zone-heating-only
    components:
      - ecodan
      - optimizer
      - asgard_dashboard
    refresh: always
    
  # Locally patched Asgard dashboard
#  - source:
#      type: local
#      path: components
#    components:
#      - asgard_dashboard

packages:
  # Local common ESPHome configuration packages
  common_wifi: !include common/wifi.yaml
  common_ota: !include common/ota.yaml
  common_api: !include common/apie.yaml
  common_web_server: !include common/web_server.yaml

  remote_package:
    url: https://github.com/22MarioZ/esphome-ecodan-hp
    ref: codex/single-zone-heating-only
    refresh: always
    files: [ 
            confs/base.yaml,            # required
            confs/energy.yaml,            # required
            confs/cpu-monitoring.yaml,    # recommended
            confs/request-codes.yaml,   # disable if your unit does not support request codes (service menu)
            confs/auto-adaptive.yaml,    # recommended, define before board def
            confs/esp32s3.yaml,         # confs/esp32.yaml, for regular board
            confs/zone1.yaml,
            confs/server-control-z1.yaml,
            ## enable label language files
            confs/ecodan-labels-en.yaml,  # English
            # confs/ecodan-labels-nl.yaml,  # Dutch
            # confs/ecodan-labels-it.yaml,  # Italian
            # confs/ecodan-labels-fr.yaml,  # French
            # confs/ecodan-labels-de.yaml,  # German
            # confs/ecodan-labels-fi.yaml,  # Finnish
            # confs/ecodan-labels-no.yaml,  # Norwegian
            # confs/ecodan-labels-sv.yaml,  # Swedish
            # confs/ecodan-labels-da.yaml,  # Danish
            # confs/ecodan-labels-pl.yaml,  # Polish
            # confs/ecodan-labels-sl.yaml,  # Slovenian
            confs/debug.yaml,
            #confs/wifi.yaml,
            confs/led.yaml,
           ]

logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    ecodan.component: WARN
    ecodan.trace: DEBUG
    auto_adaptive: DEBUG
    short_cycle: DEBUG

# logger:
#   baud_rate: 115200
  # level: WARN
  #logs:
  #   auto_adaptive: DEBUG

substitutions:
  zone_identifier_z1: "0"

binary_sensor:
  - platform: ecodan
    status_prohibit_heating_z1:
      id: status_prohibit_heating_z1
      name: ${status_prohibit_heating_z1}
    status_water_pump_2:
      id: status_water_pump_2
      name: ${status_water_pump_2}
    status_water_pump_4:
      id: status_water_pump_4
      name: ${status_water_pump_4}

climate:
  - platform: ecodan
    heatpump_climate_z1:
      name: ${heatpump_climate_z1}
      id: heatpump_climate_z1
      zone_identifier: ${zone_identifier_z1}
      get_status_func: |-
        return id(ecodan_instance).get_status();
      get_target_temp_func: |-
        auto& status = id(ecodan_instance).get_status();
        return status.Zone1FlowTemperatureSetPoint;
      target_temp_func: |-
        id(ecodan_instance).set_flow_target_temperature(x, esphome::ecodan::Zone::ZONE_1);
      current_temp_func: |-
        auto& status = id(ecodan_instance).get_status();
        return status.Zone1FlowTemperatureSetPoint;
    heatpump_climate_room_z1:
      name: ${heatpump_climate_room_z1}
      id: heatpump_climate_room_z1
      thermostat_climate_mode: true
      zone_identifier: ${zone_identifier_z1}
      get_status_func: |-
        return id(ecodan_instance).get_status();
      get_target_temp_func: |-
        auto& status = id(ecodan_instance).get_status();
        return status.Zone1SetTemperature;
      target_temp_func: |-
        id(ecodan_instance).set_room_temperature(x, esphome::ecodan::Zone::ZONE_1);
      current_temp_func: |-
        auto& status = id(ecodan_instance).get_status();
        return status.Zone1RoomTemperature;

sensor:
  - platform: ecodan
    z1_flow_temp_target:
      id: z1_flow_temp_target
      name: ${z1_flow_temp_target}
    z1_room_temp:
      id: z1_room_temp
      name: ${z1_room_temp}      
    z1_room_temp_target:
      id: z1_room_temp_target
      name: ${z1_room_temp_target}
    z1_feed_temp:
      id: z1_feed_temp
      name: ${z1_feed_temp}
    z1_return_temp:
      id: z1_return_temp
      name: ${z1_return_temp}
    mixing_valve_step_z1:
      id: mixing_valve_step_z1
      name: ${mixing_valve_step} z1

select:
  - platform: template
    name: ${heatpump_select_operating_mode}
    id: heatpump_select_operating_mode
    optimistic: true
    restore_value: true
    options:
      - ${heat_target_temperature}
      - ${heat_flow_temperature}
      - ${heat_compensation_curve}
      - ${floor_dry_up}
    set_action:
      - lambda: |-
          auto index = id(heatpump_select_operating_mode).index_of(x);
          if (index.has_value() && index.value() != id(heatpump_select_operating_mode).active_index().value_or(-1)) {
            uint8_t selected_mode = index.value();
            // Floor Dry Up remains protocol mode 5 after cooling modes are removed.
            uint8_t protocol_mode = selected_mode == 3 ? 5 : selected_mode;
            id(ecodan_instance).set_hp_mode(protocol_mode, esphome::ecodan::Zone::ZONE_1);

            climate::Climate *v_climate = nullptr;
            for (auto *c : App.get_climates()) {
              if (c->get_name() == "Virtual Thermostat z1") {
                v_climate = c;
                break;
              }
            }

            // Sync the virtual thermostat (if it exists in this build AND is not OFF)
            if (v_climate != nullptr && v_climate->mode != climate::CLIMATE_MODE_OFF) {
              auto call = v_climate->make_call();
              
              // This profile exposes heating modes only.
              if (selected_mode <= 3) {
                if (v_climate->mode != climate::CLIMATE_MODE_HEAT) {
                  call.set_mode(climate::CLIMATE_MODE_HEAT);
                  call.perform();
                }
              }
            }
          }
ecodan:
  id: ecodan_instance
  operating_mode_z1: heatpump_select_operating_mode

text_sensor:
  - platform: template
    id: master_thermostat_z1
    name: ${master_thermostat} z1
    icon: mdi:thermostat
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto value = id(ecodan_instance).get_status().MasterZone1;
      switch (value) {
        case 0: return std::string("MRC");
        case 1: return std::string("RRC1");
        case 2: return std::string("RRC2");
        case 3: return std::string("RRC3");
        case 4: return std::string("RRC4");
        case 5: return std::string("RRC5");
        case 6: return std::string("RRC6");
        case 7: return std::string("RRC7");
        case 8: return std::string("RRC8");
        case 15: return std::string("TH1");
        default: return std::to_string(value);
      }
